schema_version: 1
coordinate_system: ENU
linear_unit: metre
world_extent_m: [100.0, 100.0]
compatibility: {simulator: Gazebo Classic 11, sdf: '1.6', ros: Noetic, autopilot: PX4 SITL}
assets:
- id: procedural_service_road
  source: project-authored
  license: MIT
  dimensions: {width_m: 7.0, marking_length_m: 2.4, marking_width_m: 0.12}
  collision: false
  rationale: Ground-level visual context must not diverge from the planner collision map.
- id: procedural_building_shell
  source: project-authored
  license: MIT
  dimensions: scene-defined metric footprint and height
  collision: true
  rationale: One conservative primitive is shared with clearance analysis.
- id: procedural_roof_detail
  source: project-authored
  license: MIT
  dimensions: building footprint, top aligned with collision top, thickness at most 0.36 m
  collision: false
  rationale: Lightweight visual detail above an already conservative building collision.
- id: start_goal_decals
  source: project-authored
  license: MIT
  dimensions: {radius_m: 1.5, thickness_m: 0.02}
  collision: false
  rationale: Landing markers must never cause touchdown bounce.
external_assets:
  imported:
  - id: aws_small_warehouse
    source: https://github.com/aws-robotics/aws-robomaker-small-warehouse-world
    revision: 3c23a698bf0b4e366ddf8b084af507c519bd3483
    archive_sha256: 213417f3b243cc6259a17b1eeafba28edd44f7d129ec5904f88793f1bc75d0e6
    license: MIT-0
    attribution: Amazon.com, Inc. or its affiliates; original LICENSE retained in downloaded archive
    status: experimental-cache-only-not-mission-ready
    world: worlds/no_roof_small_warehouse.world
    dimensions_m: [13.98047, 20.90666, 9.01986]
    dimensions_basis: enclosing wall collision mesh bounds, not usable flight volume
    mesh_unit_meter: 0.01
    collision_review: extent inventory only; triangle occupancy and Gazebo equivalence pending
    performance_budget: pending; no release approval
  policy: Every future third-party asset requires immutable source URL, version, license, attribution, metric dimensions, collision review and performance budget before import.
